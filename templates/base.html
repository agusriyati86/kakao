<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hama dan Penyakit Kakao{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('home') }}" class="navbar-brand">Hama Dan Penyakit Kakao</a>
    <div class="navbar-links">
      <a href="{{ url_for('home') }}" class="{{ 'is-active' if request.endpoint == 'home' }}">Home</a>
      <a href="{{ url_for('klasifikasi') }}" class="{{ 'is-active' if request.endpoint == 'klasifikasi' }}">Klasifikasi</a>
      <a href="{{ url_for('riwayat') }}" class="{{ 'is-active' if request.endpoint == 'riwayat' }}">Riwayat</a>
      <a href="{{ url_for('info') }}" class="{{ 'is-active' if request.endpoint == 'info' }}">Info</a>
    </div>
  </nav>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-box">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
